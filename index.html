<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Familienzentrale</title>
  <meta name="description" content="Einkaufsliste, Essensplan, Kalender, Themen-Board, Infos und Urlaubsplanung für die ganze Familie.">
  <meta name="theme-color" content="#f7f5f0">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Familie">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Icon-Sprite (Strichicons, 24×24) -->
  <svg xmlns="http://www.w3.org/2000/svg" hidden>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 11.4a1.5 1.5 0 0 0 1.5 1.1h8.6a1.5 1.5 0 0 0 1.5-1.2L21 7H6"/></symbol>
    <symbol id="i-utensils" viewBox="0 0 24 24"><path d="M5 2v7a2 2 0 0 0 4 0V2M7 11v11M18 22V2c-2.5 1-4 4-4 8 0 3 1.5 4.5 4 5"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></symbol>
    <symbol id="i-topics" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="m8.5 10 2.5 2.5 4.5-4.5"/></symbol>
    <symbol id="i-family" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M16.5 14.3A5 5 0 0 1 21.5 19"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 21v-5h-5"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 3h3.5l1.5 4.5-2.2 1.4a11 11 0 0 0 7.3 7.3l1.4-2.2L21 15.5V19a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>

    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-checklist" viewBox="0 0 24 24"><path d="m3.5 6 1.5 1.5L8 4.5M3.5 12.5 5 14l3-3M3.5 19l1.5 1.5 3-3M12 6h9M12 12.5h9M12 19h9"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
  </svg>

  <header class="appbar">
    <div class="appbar-title">
      <h1 id="viewTitle">Familienzentrale</h1>
      <p id="viewSubtitle"></p>
    </div>
    <button id="installBtn" class="icon-btn" data-action="install" aria-label="App installieren" title="App installieren" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-download"></use></svg>
    </button>
    <button id="syncBtn" class="sync-btn" data-action="sync" data-status="local" aria-label="Synchronisationsstatus">
      <span class="sync-dot"></span><span class="sync-label">Lokal</span>
    </button>
    <button class="icon-btn" data-action="settings" aria-label="Einstellungen" title="Einstellungen">
      <svg class="icon" aria-hidden="true"><use href="#i-settings"></use></svg>
    </button>
  </header>

  <main id="view" class="view" tabindex="-1">
    <noscript><section class="card">Bitte JavaScript aktivieren, um die Familienzentrale zu nutzen.</section></noscript>
  </main>

  <nav class="tabbar" aria-label="Hauptnavigation">
    <a class="tab" href="#home" data-view="home"><span class="icon-wrap"><svg class="icon" aria-hidden="true"><use href="#i-home"></use></svg></span>Start</a>
    <a class="tab" href="#essen" data-view="essen"><span class="icon-wrap"><svg class="icon" aria-hidden="true"><use href="#i-utensils"></use></svg></span>Essen</a>
    <a class="tab" href="#kalender" data-view="kalender"><span class="icon-wrap"><svg class="icon" aria-hidden="true"><use href="#i-calendar"></use></svg></span>Kalender</a>
    <a class="tab" href="#themen" data-view="themen"><span class="icon-wrap"><svg class="icon" aria-hidden="true"><use href="#i-topics"></use></svg></span>Themen</a>
    <a class="tab" href="#familie" data-view="familie"><span class="icon-wrap"><svg class="icon" aria-hidden="true"><use href="#i-family"></use></svg></span>Familie</a>
  </nav>

  <dialog id="formDialog" class="sheet-dialog" aria-label="Formular"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
